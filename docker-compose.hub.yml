services:
  backend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/mern-backend:1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    env_file:
      - ./mern-demo/.env
    networks:
      - mern-network

  frontend:
    image: ${DOCKERHUB_USERNAME:-your-dockerhub-username}/mern-frontend:1.0
    container_name: mern-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge
