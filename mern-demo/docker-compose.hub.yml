services:
  backend:
    image: nhut236518/mern-backend:v1.0
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb+srv://Nhut:Joker1tuoi%40@cluster0.yqdzn0h.mongodb.net/student_db?retryWrites=true&w=majority
    networks:
      - mern-network

